<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)" opacity="0.6"/>

  <!-- PCB Board Outline -->
  <rect x="70" y="50" width="460" height="300" rx="20" fill="#111813" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Decorative PCB Traces -->
  <path d="M 90 80 L 150 80 L 180 110 L 260 110" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="260" cy="110" r="4" fill="#10b981"/>
  <circle cx="90" cy="80" r="3" fill="#10b981"/>

  <path d="M 510 80 L 450 80 L 420 120 L 360 120" fill="none" stroke="#FFC400" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="360" cy="120" r="4" fill="#FFC400"/>
  <circle cx="510" cy="80" r="3" fill="#FFC400"/>

  <path d="M 90 320 L 170 320 L 200 290 L 240 290" fill="none" stroke="#FFC400" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="240" cy="290" r="4" fill="#FFC400"/>
  <circle cx="90" cy="320" r="3" fill="#FFC400"/>

  <path d="M 510 320 L 440 320 L 400 280 L 350 280" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="350" cy="280" r="4" fill="#10b981"/>
  <circle cx="510" cy="320" r="3" fill="#10b981"/>

  <!-- Main CPU / IC Chip -->
  <rect x="230" y="130" width="140" height="140" rx="12" fill="#181818" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="245" cy="145" r="3" fill="#FFC400"/>

  <!-- IC Pins -->
  <path d="M 250 120 L 250 130 M 270 120 L 270 130 M 290 120 L 290 130 M 310 120 L 310 130 M 330 120 L 330 130 M 350 120 L 350 130" stroke="#FFC400" stroke-width="2" opacity="0.8"/>
  <path d="M 250 270 L 250 280 M 270 270 L 270 280 M 290 270 L 290 280 M 310 270 L 310 280 M 330 270 L 330 280 M 350 270 L 350 280" stroke="#FFC400" stroke-width="2" opacity="0.8"/>
  <path d="M 220 150 L 230 150 M 220 170 L 230 170 M 220 190 L 230 190 M 220 210 L 230 210 M 220 230 L 230 230 M 220 250 L 230 250" stroke="#FFC400" stroke-width="2" opacity="0.8"/>
  <path d="M 370 150 L 380 150 M 370 170 L 380 170 M 370 190 L 380 190 M 370 210 L 380 210 M 370 230 L 380 230 M 370 250 L 380 250" stroke="#FFC400" stroke-width="2" opacity="0.8"/>

  <!-- Chip Icon / Label -->
  <text x="300" y="195" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFC400" text-anchor="middle">PCB BOARD</text>
  <text x="300" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">بوردة هاتف تشليح</text>
  <text x="300" y="240" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">عالم الصيانة PRO</text>
</svg>
