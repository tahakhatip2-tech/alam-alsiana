<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="phoneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#pbg)"/>

  <!-- Phone Mockup Outline -->
  <rect x="220" y="30" width="160" height="340" rx="32" fill="#121212" stroke="url(#phoneGold)" stroke-width="3"/>

  <!-- Screen -->
  <rect x="232" y="48" width="136" height="304" rx="22" fill="#181818"/>

  <!-- Dynamic Island / Notch -->
  <rect x="270" y="58" width="60" height="12" rx="6" fill="#000"/>

  <!-- Graphic on Screen -->
  <circle cx="300" cy="180" r="32" fill="#FFC400" fill-opacity="0.1" stroke="#FFC400" stroke-width="2"/>
  <path d="M 292 180 L 298 186 L 310 172" fill="none" stroke="#FFC400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="300" y="240" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">هاتف ذكي معروض</text>
  <text x="300" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFC400" text-anchor="middle">سوق عالم الصيانة</text>

  <!-- Home indicator line -->
  <line x1="275" y1="340" x2="325" y2="340" stroke="#666" stroke-width="3" stroke-linecap="round"/>
</svg>
